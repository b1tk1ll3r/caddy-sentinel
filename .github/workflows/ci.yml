name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & Build (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: '**/go.mod'

      - name: go mod tidy
        run: |
          for d in sentinel caddy panel; do (cd "$d" && go mod tidy); done

      - name: Format
        run: |
          out=$(gofmt -l sentinel caddy panel)
          if [ -n "$out" ]; then echo "Nicht formatiert:"; echo "$out"; exit 1; fi

      - name: Tests
        run: |
          (cd sentinel && go vet ./... && go test -race ./...)
          (cd panel && go vet ./... && go test ./...)

      - name: JavaScript-Syntax
        run: |
          for f in $(find panel/web/static/js -name '*.js'); do
            cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || { echo "Syntaxfehler in $f"; exit 1; }
          done

      - name: Shell-Skripte
        run: shellcheck -S error scripts/*.sh deploy/install.sh build.sh

      - name: Release-Build (Testlauf)
        env:
          SKIP_TESTS: "1"
          VERSION: ci-${{ github.sha }}
        run: ./scripts/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ci-linux-amd64
          path: dist/*.tar.gz
          retention-days: 7
