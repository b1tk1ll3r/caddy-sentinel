# /etc/systemd/system/caddy.service.d/sentinel.conf
# Startet Caddy mit dem Sentinel-Build statt des Distributions-Binarys.
# Caddy läuft weiter als Benutzer caddy und liest vom Panel nur das
# Agent-Token (Gruppe caddy); die Datenbank des Panels bleibt ihm verschlossen.
[Service]
ExecStart=
ExecStart=/usr/local/bin/caddy run --environ --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --force
Environment=SENTINEL_PANEL=http://127.0.0.1:7600
Environment=SENTINEL_TOKEN_FILE=/var/lib/caddy-sentinel/agent.token
# Admin-API nur als Unix-Socket statt localhost:2019 (dort könnte jeder
# lokale Prozess Caddy umkonfigurieren): Zugriff nur für Benutzer und Gruppe
# caddy – das Panel ist Mitglied. CADDY_ADMIN ist Caddys Standard, solange
# die Caddyfile keine globale Option "admin" setzt; auch "caddy reload"
# (ExecReload) und "caddy stop" nehmen ihn. Von Hand als root:
#   caddy reload --config /etc/caddy/Caddyfile --address 'unix//run/caddy/admin.sock'
Environment=CADDY_ADMIN=unix//run/caddy/admin.sock|0660
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
